name: BLACKHOLE status snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reporting dependencies
        run: python -m pip install "huggingface_hub==2.2.0"
      - name: Collect read-only BLACKHOLE status
        id: collect
        continue-on-error: true
        env:
          HF_READ_TOKEN: ${{ secrets.HF_READ_TOKEN }}
        run: python -m bridge.blackhole_status
      - name: Commit changed snapshot
        if: always()
        run: |
          if git diff --quiet -- bridge/status.json reports/; then
            echo "No status change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge/status.json reports/
          git commit -m "chore: refresh BLACKHOLE status snapshot"
          git push
      - name: Fail after preserving blocked snapshot
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Status collection was blocked; the truthful blocked snapshot was committed first"
          exit 1
