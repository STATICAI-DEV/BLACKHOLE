[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackhole-lab"
version = "0.1.0"
description = "Private evidence-first language-model research laboratory and status bridge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
  "gradio==6.30.0",
  "huggingface_hub==2.2.0",
  "plotly==7.1.0",
  "psutil==7.2.2",
  "PyYAML==6.0.2",
  "truststore==0.10.4",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
model = ["torch==2.14.1"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["blackhole*"]
